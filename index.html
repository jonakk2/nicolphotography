        <h1>Nicol Juráňová – Fotografka Hranice na Moravě & Olomoucký kraj</h1>
        <p>Vítejte na oficiálním webu fotografky <strong>Nicol Juráňové</strong>. Specializuji se na přirozené a spontánní focení venku v přírodě bez strojených póz – rodinné focení, zamilované páry, těhotenské momentky, osobní portréty a focení se psy a domácími mazlíčky.</p>
        
        <h2>Nabízené fotografické služby</h2>
        <ul>
          <li><strong><a href="/portfolio">Rodinné focení v přírodě</a>:</strong> Spontánní momentky rodičů s dětmi, hry v trávě, smích a autentická atmosféra (20 fotek za 2 800 Kč).</li>
          <li><strong><a href="/portfolio">Párové a těhotenské focení</a>:</strong> Romantické záběry při západu slunce (zlatá hodinka) a příběhové momenty (10 fotek za 1 500 Kč).</li>
          <li><strong><a href="/portfolio">Portrétní focení</a>:</strong> Osobní portréty pro ženy i muže v měkkém přirozeném světle (10 fotek za 1 500 Kč).</li>
          <li><strong><a href="/portfolio">Focení se psy a mazlíčky</a>:</strong> Čtyřnohé parťáky beru jako plnohodnotné členy rodiny (10 fotek za 1 500 Kč).</li>
          <li><strong><a href="/vanocni-foceni">Vánoční minifocení 2026</a>:</strong> Kouzelná venkovní scéna u kamenného sklípku u Hranic, vůně jehličí, teplé kakao a sváteční atmosféra (8 fotek za 1 800 Kč, dárek nad 10 fotek).</li>
        </ul>

        <h2>Užitečné informace a odkazy</h2>
